name: race

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  TAGS: with_quic,with_wireguard,with_gvisor,with_acme,with_utls

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet -tags "$TAGS" ./...
      - name: test
        run: go test -count=1 -timeout 30m -tags "$TAGS" ./...
      - name: race detector on the packages that are ours alone
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 30m -tags "$TAGS" ./gate/... ./ipc/...

  # The engine tests drive real protocol stacks. Under -race the AnyTLS stack
  # (github.com/anytls/sing-anytls, a third-party library) reports an
  # unsynchronised `closed` flag between Stream.Write and Stream.Close; every
  # report so far has its both sides inside that library. Informational until the
  # library is fixed, so a race in this repository does not hide behind it:
  # read the report and check that a W1nCray-prism frame is the leaf.
  race-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: engine with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 30m -tags "$TAGS" ./engine/...
